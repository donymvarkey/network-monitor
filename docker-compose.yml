# Production stack. Only nginx publishes ports; Postgres, Redis, worker and realtime stay on the
# private "internal" network. For local development add docker-compose.dev.yml (see README).
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1g } } }
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }
    <<: *logging

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      REALTIME_INTERNAL_URL: http://realtime:4001
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy: { resources: { limits: { memory: 1g } } }
    <<: *logging

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    stop_grace_period: 30s
    healthcheck:
      # The worker writes a heartbeat row every 30 s; healthy = written in the last 90 s.
      test: ["CMD-SHELL", "node -e \"const{PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.serviceHeartbeat.findUnique({where:{service:'worker'}}).then(b=>process.exit(b&&Date.now()-b.lastBeatAt<90000?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy: { resources: { limits: { memory: 768m } } }
    <<: *logging

  realtime:
    build: { context: ., dockerfile: services/realtime/Dockerfile }
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 256m } } }
    <<: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-3000}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-3443}:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/common.conf:/etc/nginx/snippets/netmon-common.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      web: { condition: service_healthy }
      realtime: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 128m } } }
    <<: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./docker/backup:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh", "/scripts/scheduler.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    deploy: { resources: { limits: { memory: 256m } } }
    <<: *logging

  collector:
    profiles: ["collector"]
    build: { context: ., dockerfile: services/collector/Dockerfile }
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    env_file: .env.collector
    deploy: { resources: { limits: { memory: 256m } } }
    <<: *logging
  # Second collector for another LAN: run this on a host plugged into that LAN
  # with its own .env.collector (different COLLECTOR_ID/TOKEN and NETWORK_CONTEXT).

volumes:
  pgdata:
  redisdata:
  certbot-www:
networks:
  internal:
